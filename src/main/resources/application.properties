spring.application.name=store
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=store;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=S@password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Activar Flyway y establecer la ruta de migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Opcional: Permitir migraciones en bases ya existentes
spring.flyway.baseline-on-migrate=true



